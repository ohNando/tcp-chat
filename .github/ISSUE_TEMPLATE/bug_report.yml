name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! For security issues please follow SECURITY.md
        instead of opening a public issue.
  - type: dropdown
    id: component
    attributes:
      label: Component
      multiple: true
      options:
        - Server
        - Terminal client
        - Web client
        - Desktop app
        - Documentation
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the server with `./bin/server -p 8080`
        2. Connect with ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Server output, browser console or terminal output. Remove anything private.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Fedora 44, GCC 15, Node 22, Firefox 140
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`
